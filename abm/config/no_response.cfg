# Counterfactual: the same community, with no public health response at all.
# Useful as the denominator when quantifying what the response achieved.
#
#   ./measles_abm --config config/no_response.cfg --out results/no_response

population           = 60000
days                 = 365
seed                 = 2026
initial_infections   = 3
importation_per_day  = 0.01

prob_case_detected   = 0.0    # nothing is reported, so nothing is acted on
isolation_compliance = 0.0
school_exclusion     = false
household_quarantine = false
response_enabled     = false

output_dir = results/no_response
