# Baseline scenario: a community with typical North American measles immunity.
#
#   ./measles_abm --config config/baseline.cfg
#
# Every key below is also the default compiled into the model, so this file
# doubles as documentation of the parameter set. Any key can be overridden on
# the command line with --set key=value.

# ---- Simulation ------------------------------------------------------------
population            = 60000
days                  = 365
seed                  = 2026
initial_infections    = 3      # index cases seeded on day 0
importation_per_day   = 0.01   # further introductions from outside

# ---- Natural history -------------------------------------------------------
# Exposure to rash averages 14 days; a case is infectious from four days before
# the rash appears until four days after.
latent_days_mean      = 10.0
latent_days_sd        = 1.8
prodrome_days         = 4.0
rash_infectious_days  = 4.0
infectiousness_prodromal = 1.0
infectiousness_rash      = 0.85

# ---- Transmission ----------------------------------------------------------
# beta.<venue> is the per-hour hazard per infectious person sharing the room;
# contacts.<venue> caps how many other people are effectively breathing the
# same air. Calibrated to R0 ~ 15 (check with --mode r0).
beta.household         = 0.0230
beta.daycare           = 0.1400
beta.classroom         = 0.0900
beta.school_common     = 0.0280
beta.work_team         = 0.0600
beta.workplace_common  = 0.0200
beta.hospital_waiting  = 0.1100
beta.hospital_ward     = 0.0320
beta.urgent_care       = 0.2100
beta.ltcf_unit         = 0.0600
beta.ltcf_common       = 0.0300
beta.community         = 0.0100

contacts.household         = 8
contacts.daycare           = 12
contacts.classroom         = 25
contacts.school_common     = 40
contacts.work_team         = 10
contacts.workplace_common  = 30
contacts.hospital_waiting  = 25
contacts.hospital_ward     = 15
contacts.urgent_care       = 20
contacts.ltcf_unit         = 20
contacts.ltcf_common       = 35
contacts.community         = 40

# Airborne measles remains infectious in a room after the case has left.
environment_shed             = 0.35
environment_half_life_hours  = 1.2

# ---- Vaccination -----------------------------------------------------------
ve_one_dose               = 0.93
ve_two_dose               = 0.97
coverage_dose1            = 0.93
coverage_dose2_given_dose1 = 0.95
hesitancy_mean            = 0.06   # households refusing vaccination
hesitancy_clustering      = 12.0   # smaller = refusal clusters more tightly
coverage_hesitant_dose1   = 0.10
pre1957_natural_immunity  = 0.97
adult_1957_1989_one_dose  = 0.55
adult_1957_1989_two_dose  = 0.35
adult_post1989_two_dose   = 0.92
healthcare_worker_two_dose = 0.97
ltcf_staff_two_dose        = 0.93

# ---- Care seeking and severity --------------------------------------------
prob_urgent_care_prodrome = 0.14   # undiagnosed cases in the waiting room
prob_seek_care_rash       = 0.62
routine_care_visits_per_year = 3.0
hosp_prob_under1          = 0.42
hosp_prob_1to4            = 0.28
hosp_prob_5to19           = 0.11
hosp_prob_20to64          = 0.20
hosp_prob_65plus          = 0.34

# ---- Detection and response ------------------------------------------------
prob_case_detected        = 0.80
detection_delay_days      = 1.5
isolation_compliance      = 0.85
quarantine_compliance     = 0.75
quarantine_days           = 21
school_exclusion          = true
household_quarantine      = true
response_enabled          = true
response_trigger_cases    = 5
catchup_vaccination_daily = 0.02
pep_coverage              = 0.55
pep_effectiveness         = 0.83
airborne_precaution_reduction = 0.20
ltcf_lockdown_reduction       = 0.45

output_dir = results
