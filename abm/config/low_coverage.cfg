# An under-vaccinated community with tightly clustered refusal - the setting in
# which recent North American measles outbreaks have actually happened.
#
#   ./measles_abm --config config/low_coverage.cfg --out results/low_coverage

population              = 60000
days                    = 365
seed                    = 2026
initial_infections      = 2
importation_per_day     = 0.01

coverage_dose1          = 0.82
coverage_dose2_given_dose1 = 0.88
hesitancy_mean          = 0.18
hesitancy_clustering    = 2.5    # strong clustering: pockets with almost no coverage
coverage_hesitant_dose1 = 0.05
adult_post1989_two_dose = 0.85

# A late and less complete response: measles is not recognised quickly in a
# community that has not seen a case in years.
response_trigger_cases  = 12
detection_delay_days    = 3.0
prob_case_detected      = 0.65
isolation_compliance    = 0.70
quarantine_compliance   = 0.55
catchup_vaccination_daily = 0.015
catchup_vaccination_hesitant_mult = 0.08

output_dir = results/low_coverage
